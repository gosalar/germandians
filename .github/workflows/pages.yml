name: Site CI and Pages deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type-check and build for Pages
        run: npm run build -- --base "/${GITHUB_REPOSITORY#*/}/"
        env:
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_FEE_AFTER_ADMISSION: ${{ vars.VITE_FEE_AFTER_ADMISSION }}
          VITE_INTAKE_STATUS: ${{ vars.VITE_INTAKE_STATUS }}
          VITE_SHOW_SEAT_COUNT: ${{ vars.VITE_SHOW_SEAT_COUNT }}
          VITE_SEATS_LEFT: ${{ vars.VITE_SEATS_LEFT }}
          VITE_ALLOW_REPAINT: ${{ vars.VITE_ALLOW_REPAINT }}
      - run: npx playwright install --with-deps chromium
        if: hashFiles('playwright.config.ts') != ''
      - run: npm run test:visual -- --workers=2
        if: hashFiles('playwright.config.ts') != ''
      - name: Prepare static route entry points
        run: |
          mkdir -p dist/privacy
          cp dist/index.html dist/privacy/index.html
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish checked build
        id: pages
        uses: actions/deploy-pages@v4
