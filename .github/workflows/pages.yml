name: Site CI and Pages deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type-check and build for Pages
        run: npm run build
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}/
          # HTTPS receiver: 2xx JSON { received: true } only after durable receipt.
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
          # 10–15 international digits; empty/invalid actions open the review form.
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          # Advertised fee; payment timing and exceptions remain in the written quote.
          VITE_FEE_AFTER_ADMISSION: ${{ vars.VITE_FEE_AFTER_ADMISSION }}
          VITE_INTAKE_STATUS: ${{ vars.VITE_INTAKE_STATUS }}
          VITE_INTAKE_SEASON: ${{ vars.VITE_INTAKE_SEASON }}
          # Starting year: Winter + 2027 renders Winter 2027/28. Default Summer 2027.
          VITE_INTAKE_YEAR: ${{ vars.VITE_INTAKE_YEAR }}
          VITE_PRIVACY_NAMES: ${{ vars.VITE_PRIVACY_NAMES }}
          VITE_PRIVACY_ADDRESS: ${{ vars.VITE_PRIVACY_ADDRESS }}
          VITE_PRIVACY_FORM_SERVICE: ${{ vars.VITE_PRIVACY_FORM_SERVICE }}
          VITE_PRIVACY_HOSTING_PROVIDER: ${{ vars.VITE_PRIVACY_HOSTING_PROVIDER }}
          VITE_PRIVACY_RETENTION: ${{ vars.VITE_PRIVACY_RETENTION }}
          VITE_PRIVACY_AUTHORITY: ${{ vars.VITE_PRIVACY_AUTHORITY }}
          VITE_SHOW_SEAT_COUNT: ${{ vars.VITE_SHOW_SEAT_COUNT }}
          VITE_SEATS_LEFT: ${{ vars.VITE_SEATS_LEFT }}
      - run: npx playwright install --with-deps chromium
        if: hashFiles('playwright.config.ts') != ''
      - run: npm run test:visual -- --workers=2
        if: hashFiles('playwright.config.ts') != ''
      # UX builds use test-results/ux-builds; build/client remains the Pages artifact.
      - run: npm run test:ux
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/client

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish checked build
        id: pages
        uses: actions/deploy-pages@v4
